version: 1

# Configuração do GitHub Copilot para o projeto TCC
# Este arquivo define as instruções e contexto para o Copilot trabalhar com IA neste repositório

instructions:
  - |
    Você é um assistente de desenvolvimento para um projeto de TCC (Trabalho de Conclusão de Curso)
    focado em Design Digital para alunos do 3º ano.

    DIRETRIZES PRINCIPAIS:
    1. Sempre use Bootstrap 5 (última versão disponível)
    2. Todo código HTML/CSS deve ser responsivo
    3. Mantenha a acessibilidade e boas práticas de design
    4. Forneça documentação clara em português (PT-BR)

    PADRÕES DE PROJETO:
    - Estrutura clara e bem organizada
    - Componentes reutilizáveis
    - Paleta de cores consistente
    - Tipografia legível

context:
  - name: Objetivo do Projeto
    content: |
      Desenvolvimento de um exemplo de TCC para alunos de Design Digital,
      demonstrando boas práticas em design responsivo e desenvolvimento web.

  - name: Tecnologias Principais
    content: |
      - HTML5
      - CSS3 (Bootstrap 5)
      - JavaScript (Vanilla ou Bootstrap JS)
      - Responsividade mobile-first

  - name: Padrões de Código
    content: |
      - Indentação: 2 espaços
      - Comentários em português
      - Nomes de classes em inglês (convenção Bootstrap)
      - Nomenclatura descritiva para variáveis

name: Publicar no GitHub Pages

on:
  push:
    branches:
      - gerador
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos estáticos
        run: |
          mkdir -p _site/assets/css _site/docs/MODELOS
          cp index.html _site/index.html
          cp assets/css/styles.css _site/assets/css/styles.css
          cp docs/MODELOS/placeholder.png _site/docs/MODELOS/placeholder.png

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
